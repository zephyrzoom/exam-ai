server:
  port: 8081

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/exam_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

exam:
  jwt:
    secret: exam-ai-jwt-secret-2026-change-me
    expire-hours: 12
  ai:
    # 配置 OpenAI 兼容接口后启用真实大模型；留空则使用内置规则引擎兜底
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen-plus}
  hr:
    # 人事管理系统接口地址；留空则使用内置 Mock（演示数据 + 本地日志）
    base-url: ${HR_BASE_URL:}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:exam-noreply@example.com}

logging:
  level:
    com.exam: info